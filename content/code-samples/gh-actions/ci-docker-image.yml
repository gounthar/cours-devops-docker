# tag::common[]
name: Bonjour
on:
  - push
jobs:
  dire_bonjour:
    runs-on: ubuntu-latest
# end::common[]
# tag::container[]
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu # La même image que le Codespace
# end::container[]
# tag::common[]
    steps:
# end::common[]
# tag::checkout[]
      - uses: actions/checkout@v7 # Récupère le contenu du dépôt correspondant au commit du workflow en cours
# end::checkout[]
# tag::show-readme[]
      - run: ls -l # Liste les fichiers du répertoire courant
      - run: cat README.adoc # Affiche le contenu du fichier `README.adoc` à la base du dépôt
# end::show-readme[]
# tag::apt-cowsay[]
      - run: | # Pas de `sudo` : dans un conteneur, le job tourne déjà en root
          apt-get update
          apt-get install -y cowsay
# end::apt-cowsay[]
# tag::run-cowsay[]
      - run: cat README.adoc | /usr/games/cowsay # `cowsay` s'installe dans /usr/games, absent du PATH
# end::run-cowsay[]

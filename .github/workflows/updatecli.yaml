name: updatecli
on:
  # Allow to be run manually
  workflow_dispatch:
  schedule:
    # Run once per week (to avoid alert fatigue)
    - cron: '0 2 * * 1' # Every Monday at 2am UTC
  push:
  pull_request:
jobs:
  updatecli:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gounthar'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v3.7.0

      # Le SCM github clone la branche des valeurs (main par défaut) : sans
      # surcharge, le diff d'une PR vérifierait le texte de main (#588).
      # head_ref sur pull_request, ref_name sur push. Passé par env et non
      # interpolé dans run : le nom de branche vient de l'auteur de la PR.
      - name: Run Updatecli in Dry Run mode
        run: >-
          updatecli pipeline diff
          --config ./updatecli/updatecli.d
          --values ./updatecli/values.github-action.yaml
          --values-inline "{\"github\":{\"branch\":\"${DIFF_BRANCH}\"}}"
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Run Updatecli in Apply mode
        if: github.ref == 'refs/heads/main'
        run: updatecli pipeline apply --config ./updatecli/updatecli.d --values ./updatecli/values.github-action.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

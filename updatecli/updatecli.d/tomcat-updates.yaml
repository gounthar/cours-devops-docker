---
name: "Update Tomcat Docker image to latest version"

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  tomcat-temurin:
    name: "Get latest Tomcat JDK Temurin Docker image tag"
    kind: "dockerimage"
    spec:
      image: "tomcat"
      tagfilter: '^1\d+\.\d+\.\d+-jdk(2[5-9]|[3-9]\d+)-temurin-noble$'
      versionfilter:
        kind: "regex"
        pattern: '^\d+\.\d+\.\d+-jdk(2[5-9]|[3-9]\d+)-temurin-noble$'

targets:
  tomcat-docker-command:
    name: "Update Tomcat Docker image in the TP07 docker container run command"
    kind: "file"
    sourceid: "tomcat-temurin"
    scmid: default
    spec:
      file: "content/chapitres/fichiers-nommage-inspect.adoc"
      # The command is wrapped over several lines: match the image tag alone.
      matchpattern: 'tomcat:\d+\.\d+\.\d+-jdk\d+-temurin-noble'
      replacepattern: 'tomcat:{{ source "tomcat-temurin" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: '[TP07] Update Tomcat Docker image to {{ source "tomcat-temurin" }}'
    spec:
      labels:
        - dependencies

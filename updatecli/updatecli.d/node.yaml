---
name: Bumps the node docker images to the latest LTS major

# Dependabot ignores semver-major on these Dockerfiles (.github/dependabot.yml):
# it cannot tell an LTS from a Current release, and took the course from
# node 18 to 26 one major at a time, odd versions included (#483).
# This manifest moves the major instead, and only to an LTS.

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  nodeLatestLTSMajor:
    name: Get the major of the latest Node.js LTS release
    kind: json
    spec:
      file: https://nodejs.org/dist/index.json
      key: .(lts!=false).version
    transformers:
      - findsubmatch:
          pattern: '^v(\d+)\.'
          captureindex: 1

conditions:
  # Forward only: until an even major turns LTS, the latest LTS is older
  # than the pin (26 vs 24 in October 2026), and this pipeline would
  # otherwise open a downgrade.
  testLTSNotOlderThanPins:
    name: "Test that the LTS major is not older than any pinned major"
    kind: shell
    disablesourceinput: true
    scmid: default
    spec:
      command: >-
        sh -c 'for f in Dockerfile content/code-samples/compose/cours/Dockerfile
        content/code-samples/fichiers/copie-fichiers/Dockerfile;
        do test {{ source "nodeLatestLTSMajor" }} -ge
        "$(sed -n "s/^FROM node:\([0-9]*\)-alpine.*/\1/p" "$f")" || exit 1; done'
  testNodeAlpineImagePublished:
    name: "Test that the node:<lts_major>-alpine image tag exists"
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: "node"
      tag: '{{ source "nodeLatestLTSMajor" }}-alpine'

targets:
  updateSlidesBuilderDockerfile:
    name: "Update the node image of the slides builder"
    kind: file
    sourceid: nodeLatestLTSMajor
    scmid: default
    spec:
      file: Dockerfile
      matchpattern: 'FROM node:\d+-alpine'
      replacepattern: 'FROM node:{{ source "nodeLatestLTSMajor" }}-alpine'
  updateComposeCoursDockerfile:
    name: "Update the node image of the compose course sample"
    kind: file
    sourceid: nodeLatestLTSMajor
    scmid: default
    spec:
      file: content/code-samples/compose/cours/Dockerfile
      matchpattern: 'FROM node:\d+-alpine'
      replacepattern: 'FROM node:{{ source "nodeLatestLTSMajor" }}-alpine'
  updateCopieFichiersDockerfile:
    name: "Update the node image of the file copy sample"
    kind: file
    sourceid: nodeLatestLTSMajor
    scmid: default
    spec:
      file: content/code-samples/fichiers/copie-fichiers/Dockerfile
      matchpattern: 'FROM node:\d+-alpine'
      replacepattern: 'FROM node:{{ source "nodeLatestLTSMajor" }}-alpine'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'Bump node docker images to the {{ source "nodeLatestLTSMajor" }} LTS'
    spec:
      labels:
        - dependencies

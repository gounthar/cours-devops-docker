---
name: "Update Tomcat Docker image to latest version"

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  tomcat-temurin:
    name: "Get latest Tomcat 11 on JDK 25 Temurin image tag"
    kind: "dockerimage"
    spec:
      image: "tomcat"
      # Tomcat 11 on JDK 25 (LTS), like TP12: a new major of either is a
      # teaching decision, not an automatic update. regex/semver sorts the
      # versions; plain regex keeps the registry's order.
      versionfilter:
        kind: "regex/semver"
        regex: '^(\d+\.\d+\.\d+)-jdk25-temurin$'
        pattern: "~11"

targets:
  tomcat-docker-command:
    name: "Update Tomcat Docker image in the TP07 solution Dockerfile"
    kind: "file"
    sourceid: "tomcat-temurin"
    scmid: default
    spec:
      file: "content/code-samples/fichiers/reseau/tomcat/Dockerfile"
      matchpattern: 'FROM tomcat:\d+\.\d+\.\d+-jdk25-temurin'
      replacepattern: 'FROM tomcat:{{ source "tomcat-temurin" }}'

  tomcat-tp12-solution:
    name: "Update Tomcat Docker image in the TP12 solution Dockerfile"
    kind: "file"
    sourceid: "tomcat-temurin"
    scmid: default
    spec:
      file: "content/code-samples/compose/tp12/tomcat/Dockerfile"
      matchpattern: 'FROM tomcat:\d+\.\d+\.\d+-jdk25-temurin'
      replacepattern: 'FROM tomcat:{{ source "tomcat-temurin" }}'

  tomcat-tp12-statement:
    name: "Update Tomcat Docker image in the TP12 statement slide"
    kind: "file"
    sourceid: "tomcat-temurin"
    scmid: default
    spec:
      file: "content/chapitres/compose.adoc"
      matchpattern: 'tomcat:\d+\.\d+\.\d+-jdk25-temurin'
      replacepattern: 'tomcat:{{ source "tomcat-temurin" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: '[TP07/TP12] Update Tomcat Docker image to {{ source "tomcat-temurin" }}'
    spec:
      labels:
        - dependencies

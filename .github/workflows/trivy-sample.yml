---
# Met à jour content/trivy.adoc, le résultat Trivy affiché par la diapositive
# « Exemple de résultat Trivy » (chapitre sécurité).
#
# Le total était recopié à la main et périmé en quelques heures : 3277 le
# matin du 2026-10-13, 3602 le soir, même version de Trivy. Ce job relance le
# scan (scripts/gen_trivy_sample.py) et ouvre une PR quand un chiffre change :
# le nombre publié est daté et relu avant d'arriver dans les diapositives.
#
# Pas dans `make build` : la construction resterait dépendante du Hub et du
# réseau, ce que la carte Anatomie évite déjà (#548).
#
# Une PR ouverte avec GITHUB_TOKEN ne déclenche pas les autres workflows :
# Build Slides ne tourne pas dessus tout seul, comme pour les PR updatecli.
name: Trivy sample

on:
  schedule:
    # Lundi 08:17 UTC : ni la minute de link-check.yml (06:27), ni celle de
    # gh-pages-prune.yml (05:13), ni celle de anatomy-commands.yml (07:41).
    - cron: '17 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # L'image scannée est celle du backend phase1 : quand updatecli la
      # fait monter, le chiffre doit suivre sans attendre le lundi.
      - content/code-samples/securevote/phase1/backend/Dockerfile
      - scripts/gen_trivy_sample.py
      - .github/workflows/trivy-sample.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trivy-sample
  cancel-in-progress: false

env:
  BRANCH: trivy-sample/update

jobs:
  scan:
    name: 'Scan the phase1 base image and propose the new figures'
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gounthar'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy and regenerate content/trivy.adoc
        run: python3 scripts/gen_trivy_sample.py

      # La date change à chaque passage : sans ce filtre, une PR par semaine
      # pour un fichier dont aucun chiffre n'a bougé.
      - name: Check whether a figure changed
        id: diff
        run: |
          if git diff -U0 -- content/trivy.adoc | grep '^[-+]:' | grep -vq '^[-+]:trivy-date:'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- content/trivy.adoc
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No figure changed, nothing to propose."
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add content/trivy.adoc
          total=$(sed -n 's/^:trivy-total: //p' content/trivy.adoc)
          image=$(sed -n 's/^:trivy-image: //p' content/trivy.adoc)
          git commit -m "docs(securite): Trivy figure for ${image}: ${total}"
          # Branche réservée à ce job : la réécrire est voulu.
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "docs(securite): Trivy figure for ${image}: ${total}" \
              --body "Regenerated by the Trivy sample workflow (run ${GITHUB_RUN_ID}). The diff of content/trivy.adoc is the whole change." \
              --label documentation
          fi

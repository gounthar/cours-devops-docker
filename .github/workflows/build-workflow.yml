name: Slides Workflow

# The `create:` trigger was removed here -- see issue #482. Its `tags:` filter
# is silently ignored by GitHub (actionlint: "tags filter is not available for
# create event"), so it fired on *every* branch creation as well. The `push`
# trigger below carries a `tags` filter that is honoured.
on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

# Without this block the jobs inherit the repository default, which this
# repository sets to `write`: the job that only builds slides was handed a
# read/write token. See issue #481.
permissions:
  contents: read

env:
  REPOSITORY_URL: https://github.com/${{ github.repository }}
  PRESENTATION_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.ref_name }}

jobs:
  build-slides:
    name: 'Build Slides'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check environment'
        run: |
          docker compose version
          echo "$REPOSITORY_URL"
          echo "$PRESENTATION_URL"
      # This job never pushes, so the checkout token has no reason to survive
      # in .git/config once the clone is done. Same reasoning as link-check.yml.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 'Validate package-lock.json sync'
        run: |
          cd npm-packages
          # Check if package.json and package-lock.json are in sync
          if ! npm ci --dry-run > /dev/null 2>&1; then
            echo "❌ ERROR: package.json and package-lock.json are out of sync"
            echo ""
            echo "To fix this issue:"
            echo "  1. Run: make dependencies-lock-update"
            echo "  2. Commit the updated package-lock.json"
            echo "  3. Push your changes"
            exit 1
          fi
          echo "✅ package.json and package-lock.json are in sync"
      - name: Build HTML slides
        run: make build
      - name: Build exam HTML slides
        run: SOURCE_FILE=index-examen.adoc make build
      - name: Build PDF slides
        run: make pdf # Reuses the 'make build' steps
      - name: Build exam PDF document
        run: make exam-pdf
      - name: 'Verify'
        run: make verify
      - name: 'Upload dist/ as artefact'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-slides]
    # Only run deploy when pushing code on a branch of the repository
    if: github.event_name == 'push'
    # The only job that writes to the repository: it force-pushes to gh-pages.
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
    - name: 'Download dist/ Artefacts'
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: ./dist
    - name: 'Deploy to GitHub Pages'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        destination_dir: ${{ github.ref_name }}/
